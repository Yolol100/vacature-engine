[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vacature-engine"
version = "3.5.0"
description = "Credential-free vacancy normalization, ATS adapters and deterministic helpers for vacature-search"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Webactueel" }]
keywords = ["jobs", "vacancies", "ats", "greenhouse", "lever", "ashby", "smartrecruiters", "personio"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
extract = ["trafilatura>=2.0,<3"]
browser = ["playwright>=1.55,<2"]
catalog = ["ats-scrapers>=0.2,<0.3"]
dev = ["ruff>=0.12,<1"]

[project.scripts]
vacature-engine = "vacature_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

name: Ingestion tests (no live searches)

on:
  pull_request:
    paths:
      - "ingestion/**"
      - ".github/workflows/ingestion-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingestion-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ingestion package
        run: python -m pip install -e ingestion
      - name: Run ingestion regression suite
        run: PYTHONPATH=ingestion/src python -m unittest discover -s ingestion/tests -p "test_*.py" -v

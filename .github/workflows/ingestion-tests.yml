name: Full Python regression checks (no live searches)

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "ingestion/**"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "docs/**"
      - ".github/workflows/ingestion-tests.yml"
      - ".github/workflows/free-google-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the two separate packages
        run: python -m pip install -e . -e ingestion
      - name: Compile all tracked Python and parse JSON/TOML
        run: |
          python - <<'PY'
          import ast
          import json
          import subprocess
          import tomllib
          from pathlib import Path

          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          count = 0
          for item in files:
              if not item:
                  continue
              path = Path(item.decode("utf-8"))
              if path.suffix not in {".py", ".json", ".toml"}:
                  continue
              raw = path.read_text(encoding="utf-8")
              if path.suffix == ".py":
                  ast.parse(raw, filename=str(path))
              elif path.suffix == ".json":
                  json.loads(raw)
              else:
                  tomllib.loads(raw)
              count += 1
          print("Validated source/configuration files:", count)
          PY
      - name: Deterministic root engine regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Public-ingestion regression suite
        run: python -m unittest discover -s ingestion/tests -p "test_*.py" -v
      - name: Dependency consistency
        run: python -m pip check
      - name: Controlled mutation smoke (primary Python)
        if: ${{ matrix.python-version == '3.11' }}
        run: python scripts/mutation_smoke.py

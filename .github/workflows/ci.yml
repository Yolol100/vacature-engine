name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  assurance:
    name: assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -e .
      - name: Controlled mutation smoke
        run: python scripts/mutation_smoke.py
      - name: Reproducible release evidence
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct HEAD)"
          python scripts/build_release_bundle.py --output-dir release-a --commit "$GITHUB_SHA" --source-date-epoch "$epoch"
          python scripts/build_release_bundle.py --output-dir release-b --commit "$GITHUB_SHA" --source-date-epoch "$epoch"
          diff -qr release-a release-b

  codeql-gate:
    name: codeql-gate
    permissions:
      contents: read
      security-events: write
      packages: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  unit-tests:
    name: unit-tests (Python ${{ matrix.python-version }})
    needs: [assurance, codeql-gate]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Enforce prerequisite gates
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.assurance.result }}" = "success"
          test "${{ needs.codeql-gate.result }}" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Install ingestion package for required gate
        if: matrix.python-version == '3.12'
        run: python -m pip install -e ingestion
      - name: Run ingestion regression suite for required gate
        if: matrix.python-version == '3.12'
        run: python -m unittest discover -s ingestion/tests -v
      - name: Compile ingestion package for required gate
        if: matrix.python-version == '3.12'
        run: python -m compileall -q ingestion/src
      - name: Benchmark ingestion for required gate
        if: matrix.python-version == '3.12'
        run: python -m vacature_ingestion benchmark --count 10000

name: Vacature Radar Actions review-only

on:
  pull_request:
    paths:
      - 'cloudflare-radar/**'
      - '.github/workflows/vacature-review-actions.yml'
  workflow_dispatch:
    inputs:
      max_candidates:
        description: 'Maximum official-source review candidates'
        required: true
        default: '5'
        type: choice
        options:
          - '5'
          - '10'
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  # GitHub queue:max serializes up to 100 pending runs without replacing
  # an earlier pending request; do not enable cancel-in-progress.
  group: vacature-actions-review
  queue: max

jobs:
  review-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Static and regression checks (no secrets)
        working-directory: cloudflare-radar
        run: |
          npm run check
          node --check src/actions-review.mjs
          node --check src/actions-review-cli.mjs
          node --test test/*.test.mjs

  review:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'Yolol100') ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == 'Yolol100' &&
       github.actor == 'Yolol100' &&
       (github.event.issue.title == '[radar] review 5' ||
        github.event.issue.title == '[radar] review 10'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      RADAR_ISSUE_TITLE: ${{ github.event.issue.title }}
      RADAR_MAX_CANDIDATES: ${{ inputs.max_candidates }}
      VACATURE_REGISTER_ID: '1Owg3s5ZzPuCYTucp6ArgUNoWijKDr2TwvgbAUsJWdz0'
      RADAR_RESULT_ID: '1uLr7snvnCw2JmzdIL_yN4Jln0tMZJnOZK-mfh_DygwQ'
      RADAR_BASELINE_MIN_RECORDS: '26'
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Read-only review (never sends, submits or writes sheets)
        run: node cloudflare-radar/src/actions-review-cli.mjs

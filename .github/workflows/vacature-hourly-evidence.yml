name: Vacature hourly evidence rollup

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read

concurrency:
  group: vacature-hourly-evidence
  cancel-in-progress: false

jobs:
  summarize:
    if: >-
      github.actor == 'Yolol100' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        github.event.issue.user.login == 'Yolol100' &&
        github.event.issue.title == '[radar] hourly evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RADAR_ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Historical read-only hourly scheduled-event diagnostic
        run: python radar/scripts/hourly_rollup.py
      - name: Keep only bounded technical rollup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radar-hourly-${{ github.run_id }}
          path: .runtime/hourly-rollup.json
          retention-days: 2
          if-no-files-found: warn

name: Vacature Radar - openbare bronnen en browser (30m)

# Explicitly requested by the account owner on 2026-11-21.
# Scan ONLY public job data. No application or private Register data in Actions.
on:
  schedule:
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke, full public sweep, or free-Google-account check (no search)'
        required: true
        type: choice
        default: smoke
        options: [smoke, searxng_smoke, full, google_check, google_probe]

permissions:
  contents: read

concurrency:
  group: vacature-public-browser-worker
  cancel-in-progress: false

jobs:
  public-vacancy-sweep:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # publish only public job source observations to radar-public-data
    steps:
      - name: Checkout trusted main source without a persisted credential
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: trusted-source
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run no-network security and parsing tests
        working-directory: trusted-source
        run: python -m unittest discover -s ingestion/tests -p test_scheduled_worker.py -v
      - name: Inspect installed Chrome (do not claim browser coverage if missing)
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
          else
            echo 'BROWSER_NOT_AVAILABLE: JS rendering will be recorded as not attempted'
          fi
      - name: Start private SearXNG after checkout (never a service volume)
        if: github.event_name == 'schedule' || inputs.mode == 'full' || inputs.mode == 'searxng_smoke'
        shell: bash
        run: |
          set -euo pipefail
          # Source is checked out BEFORE this step. Only JSON format is
          # enabled, while all built-in engine defaults stay intact.
          config="$GITHUB_WORKSPACE/trusted-source/searxng/settings.yml"
          test -s "$config"
          secret="$(openssl rand -hex 32)"
          if ! docker run --detach --rm --name vacancy-radar-searxng \\
            --memory=1g --cpus=2 --pids-limit=256 \\
            --publish 127.0.0.1:8080:8080 \\
            --mount "type=bind,source=$config,target=/etc/searxng/settings.yml,readonly" \\
            --env "SEARXNG_SECRET=$secret" \\
            docker.io/searxng/searxng@sha256:fc1d81d7e9d04d3c8b3e23c7162feddf5c3d6aecd32e67a56eaabcb8d8747f79; then
            echo '::warning::Local SearXNG unavailable; using official feeds / safe API only'
            exit 0
          fi
          ready=false
          for i in $(seq 1 35); do
            if curl --silent --show-error --fail --max-time 3 \\
                 http://127.0.0.1:8080/ >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" == "true" ]]; then
            echo 'SEARXNG_ENABLED=true' >> "$GITHUB_ENV"
            echo 'PASS: localhost SearXNG ready; JSON searched by worker'
          else
            echo '::warning::Local SearXNG did not become healthy; no search coverage asserted'
          fi
      - name: Scan registered public sources and targeted search results
        working-directory: trusted-source
        timeout-minutes: 21
        shell: bash
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          RADAR_TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          mode="full"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="$(python -c "import json,os;print(json.load(open(os.environ['GITHUB_EVENT_PATH'])).get('inputs',{}).get('mode','smoke'))")"
          fi
          if [[ "$mode" == "google_check" ]]; then
            # Read-only account check: does not spend a search credit.
            python ingestion/scheduled_worker.py --google-check-only
            exit 0
          fi
          if [[ "$mode" == "google_probe" ]]; then
            # Explicit manual one-shot test; still refuses any paid/unknown plan.
            python ingestion/scheduled_worker.py --google-probe-only
            exit 0
          fi
          # At most one free Google Jobs search per 4 hours (<=186/month).
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$RADAR_TRIGGER_CRON" == "7 * * * *" ]]; then
            hour="$(date -u +%H)"
            if (( 10#$hour % 4 == 0 )); then
              export RADAR_GOOGLE_FREE_SLOT=true
            fi
          fi
          if [[ "$mode" == "smoke" ]]; then
            python ingestion/scheduled_worker.py --registry ingestion/sources.public-snapshot.json \
              --output "$RUNNER_TEMP/radar-latest.json" --limit 6 --no-browser --no-google
          elif [[ "$mode" == "searxng_smoke" ]]; then
            if [[ "${SEARXNG_ENABLED:-}" != "true" ]]; then
              echo "::error::Local SearXNG Docker service was not healthy"
              exit 1
            fi
            # Real multi-engine search, only six source URL checks, no publish.
            python ingestion/scheduled_worker.py --registry ingestion/sources.public-snapshot.json \
              --output "$RUNNER_TEMP/radar-latest.json" --limit 6 --no-browser
          else
            python ingestion/scheduled_worker.py --registry ingestion/sources.public-snapshot.json \
              --output "$RUNNER_TEMP/radar-latest.json" --max-render 90
          fi
          python - "$RUNNER_TEMP/radar-latest.json" <<'PY'
          import json,sys
          from pathlib import Path
          x=json.loads(Path(sys.argv[1]).read_text(encoding="utf8"))
          assert x["schema_version"]==1 and x["source_count"]==233
          assert len(x["sources"])==233
          assert all(s["source_id"] and s["status"] for s in x["sources"])
          assert all(j["review_status"]=="unverified" for j in x["observations"])
          print("Scan saved:",x["summary"])
          print("Public multi-engine statuses:",
                [q["status"] for q in x.get("google",[])])
          PY
      - name: Checkout isolated public-results branch after browsing is complete
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: radar-public-data
          path: public-results
          persist-credentials: true
      - name: Publish ONLY public-source observations for existing Apps Script intake
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/radar-latest.json" public-results/latest.json
          cd public-results
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          if git diff --cached --quiet; then
            echo 'NO_CHANGE: public snapshot unchanged'
            exit 0
          fi
          git commit -m 'data: refresh public vacancy source observations'
          git push origin HEAD:radar-public-data
          echo 'PASS: public observations published; Google Sheets ingestion is separate'
      - name: Remove ephemeral localhost SearXNG
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'full')
        shell: bash
        run: docker rm --force vacancy-radar-searxng >/dev/null 2>&1 || true

name: Vacature Ingestion

on:
  push:
    branches: [main]
    paths: ['ingestion/**', '.github/workflows/vacature-ingestion.yml']
  pull_request:
    paths: ['ingestion/**', '.github/workflows/vacature-ingestion.yml']
  schedule:
    - cron: '7 * * * *'
    - cron: '17 */6 * * *'
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: vacature-ingestion
  cancel-in-progress: false

jobs:
  ingestion-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ingestion
      - run: python -m unittest discover -s ingestion/tests -v
      - run: python -m compileall -q ingestion/src
      - run: python -m vacature_ingestion benchmark --count 10000

  live-ingestion:
    if: github.event_name != 'pull_request'
    needs: ingestion-tests
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ingestion
      - name: Restore technical state and review handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          printf '%s\n' '{"schema_version":1,"acked_keys":[],"migrations":[]}' > .runtime/review-ack.json
          git fetch origin ingestion-state || true
          if git show-ref --verify --quiet refs/remotes/origin/ingestion-state; then
            git show origin/ingestion-state:state.sqlite3 > .runtime/state.sqlite3
            if git cat-file -e origin/ingestion-state:review-queue.json 2>/dev/null; then
              git show origin/ingestion-state:review-queue.json > .runtime/previous-review-queue.json
            fi
            if git cat-file -e origin/ingestion-state:review-ack.json 2>/dev/null; then
              git show origin/ingestion-state:review-ack.json > .runtime/review-ack.json
            fi
          fi
          python -m vacature_ingestion.workflow_state normalize-ack --path .runtime/review-ack.json
      - name: Select source class
        id: source_class
        shell: bash
        run: |
          set -euo pipefail
          specs="ingestion/source-specs.live.json"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            specs="ingestion/source-specs.deploy.json"
          elif [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "7 * * * *" ]]; then
            specs="ingestion/source-specs.fast.json"
          elif [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "41 3 * * *" ]]; then
            specs="ingestion/source-specs.daily.json"
          fi
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          echo "Using $specs"
      - name: Resolve active sources from Vacature Register
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: >-
          python -m vacature_ingestion filter-specs
          --specs "${{ steps.source_class.outputs.specs }}"
          --spreadsheet-id 1Owg3s5ZzPuCYTucp6ArgUNoWijKDr2TwvgbAUsJWdz0
          --out .runtime/active-source-specs.json
      - name: Ingest public sources
        id: ingest
        shell: bash
        run: |
          set +e
          python -m vacature_ingestion ingest-many --specs .runtime/active-source-specs.json --state .runtime/state.sqlite3 --out .runtime/latest.json --allow-partial > .runtime/ingest-console.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat .runtime/ingest-console.json
      - name: Recover requested pending review backlog
        run: >-
          python -m vacature_ingestion.workflow_state recover-review
          --request ingestion/review-backlog-recovery.json
          --ack .runtime/review-ack.json
          --state .runtime/state.sqlite3
          --out .runtime/recovery-review-queue.json
      - name: Export persistent compact review queue
        run: >-
          python -m vacature_ingestion.workflow_state build-review-queue
          --current .runtime/latest.json
          --previous .runtime/previous-review-queue.json
          --recovery .runtime/recovery-review-queue.json
          --ack .runtime/review-ack.json
          --out .runtime/review-queue.json
          --pages-dir .runtime/review-queue-pages
          --index-out .runtime/review-queue-index.json
      - name: Export source health
        run: python -m vacature_ingestion export-state --state .runtime/state.sqlite3 --health-out .runtime/source-health.json
      - name: Sync compact health to Vacature Register when configured
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: >-
          python -m vacature_ingestion sync-register
          --spreadsheet-id 1Owg3s5ZzPuCYTucp6ArgUNoWijKDr2TwvgbAUsJWdz0
          --summary .runtime/latest.json
          --health .runtime/source-health.json
          --queue .runtime/review-queue-index.json
      - name: Persist technical state without clobbering review acknowledgements
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ingestion-state || true

          if ! git show-ref --verify --quiet refs/remotes/origin/ingestion-state; then
            rm -rf /tmp/vacature-ingestion-state
            git worktree add --detach /tmp/vacature-ingestion-state HEAD
            cd /tmp/vacature-ingestion-state
            git switch --orphan ingestion-state-snapshot
            git rm -rf . >/dev/null 2>&1 || true
            cp "$GITHUB_WORKSPACE/.runtime/state.sqlite3" state.sqlite3
            cp "$GITHUB_WORKSPACE/.runtime/latest.json" latest.json
            cp "$GITHUB_WORKSPACE/.runtime/review-queue.json" review-queue.json
            cp "$GITHUB_WORKSPACE/.runtime/review-queue-index.json" review-queue-index.json
            cp -R "$GITHUB_WORKSPACE/.runtime/review-queue-pages" review-queue-pages
            cp "$GITHUB_WORKSPACE/.runtime/review-ack.json" review-ack.json
            cp "$GITHUB_WORKSPACE/.runtime/source-health.json" source-health.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.sqlite3 latest.json review-queue.json review-queue-index.json review-queue-pages review-ack.json source-health.json
            git commit -m "chore: persist vacancy ingestion snapshot"
            git push origin HEAD:ingestion-state
            exit 0
          fi

          success=0
          for attempt in 1 2; do
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force /tmp/vacature-ingestion-state >/dev/null 2>&1 || true
            rm -rf /tmp/vacature-ingestion-state
            git fetch origin ingestion-state
            git worktree add --detach /tmp/vacature-ingestion-state origin/ingestion-state
            cd /tmp/vacature-ingestion-state
            git switch -c "ingestion-state-update-${GITHUB_RUN_ID}-${attempt}"
            cp "$GITHUB_WORKSPACE/.runtime/state.sqlite3" state.sqlite3
            cp "$GITHUB_WORKSPACE/.runtime/latest.json" latest.json
            cp "$GITHUB_WORKSPACE/.runtime/source-health.json" source-health.json
            python -m vacature_ingestion.snapshot_merge --state-dir . --runtime-dir "$GITHUB_WORKSPACE/.runtime"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.sqlite3 latest.json review-queue.json review-queue-index.json review-queue-pages review-ack.json source-health.json
            if git diff --cached --quiet; then
              success=1
              break
            fi
            git commit -m "chore: persist vacancy ingestion snapshot"
            if git push origin HEAD:ingestion-state; then
              success=1
              break
            fi
          done
          test "$success" = "1"
      - name: Enforce ingestion success threshold
        if: always()
        run: test "${{ steps.ingest.outputs.exit_code }}" = "0"

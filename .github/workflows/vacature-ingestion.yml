name: Vacature Ingestion

on:
  push:
    branches: [main]
    paths: ['ingestion/**', '.github/workflows/vacature-ingestion.yml']
  pull_request:
    paths: ['ingestion/**', '.github/workflows/vacature-ingestion.yml']
  schedule:
    - cron: '17 */6 * * *'
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: vacature-ingestion
  cancel-in-progress: false

jobs:
  ingestion-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ingestion
      - run: python -m unittest discover -s ingestion/tests -v
      - run: python -m compileall -q ingestion/src
      - run: python -m vacature_ingestion benchmark --count 10000

  live-ingestion:
    if: github.event_name != 'pull_request'
    needs: ingestion-tests
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ingestion
      - name: Restore technical state and review handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          printf '%s\n' '{"schema_version":1,"acked_keys":[],"migrations":[]}' > .runtime/review-ack.json
          git fetch origin ingestion-state || true
          if git show-ref --verify --quiet refs/remotes/origin/ingestion-state; then
            git show origin/ingestion-state:state.sqlite3 > .runtime/state.sqlite3
            if git cat-file -e origin/ingestion-state:review-queue.json 2>/dev/null; then
              git show origin/ingestion-state:review-queue.json > .runtime/previous-review-queue.json
            fi
            if git cat-file -e origin/ingestion-state:review-ack.json 2>/dev/null; then
              git show origin/ingestion-state:review-ack.json > .runtime/review-ack.json
            fi
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.runtime/review-ack.json')
          fallback = {'schema_version': 1, 'acked_keys': [], 'migrations': []}
          try:
              value = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(value, dict):
                  raise ValueError('ack document must be an object')
          except (OSError, ValueError, json.JSONDecodeError):
              value = fallback
          value.setdefault('schema_version', 1)
          value.setdefault('acked_keys', [])
          value.setdefault('migrations', [])
          path.write_text(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          PY
      - name: Select source class
        id: source_class
        shell: bash
        run: |
          set -euo pipefail
          specs="ingestion/source-specs.live.json"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            specs="ingestion/source-specs.deploy.json"
          elif [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "41 3 * * *" ]]; then
            specs="ingestion/source-specs.daily.json"
          fi
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          echo "Using $specs"
      - name: Ingest public sources
        id: ingest
        shell: bash
        run: |
          set +e
          python -m vacature_ingestion ingest-many --specs "${{ steps.source_class.outputs.specs }}" --state .runtime/state.sqlite3 --out .runtime/latest.json --allow-partial > .runtime/ingest-console.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat .runtime/ingest-console.json
      - name: Recover requested pending review backlog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from vacature_ingestion.review_backlog import load_review_backlog

          request_path = Path('ingestion/review-backlog-recovery.json')
          ack_path = Path('.runtime/review-ack.json')
          recovery_path = Path('.runtime/recovery-review-queue.json')
          recovery_path.write_text('{}\n', encoding='utf-8')
          if not request_path.exists():
              print(json.dumps({'recovery': 'not_requested'}))
              raise SystemExit(0)

          request = json.loads(request_path.read_text(encoding='utf-8'))
          ack = json.loads(ack_path.read_text(encoding='utf-8'))
          migration_id = str(request.get('migration_id') or '').strip()
          since = str(request.get('since') or '').strip()
          origin_run_id = str(request.get('origin_run_id') or f'recovery:{migration_id}')
          if not migration_id or not since:
              raise SystemExit('review backlog recovery request requires migration_id and since')

          migrations = [str(value) for value in ack.get('migrations', []) if value]
          if migration_id in migrations:
              print(json.dumps({'recovery': 'already_applied', 'migration_id': migration_id}, sort_keys=True))
              raise SystemExit(0)

          rows = load_review_backlog('.runtime/state.sqlite3', since=since, active_only=True)
          recovery = {
              'run_id': origin_run_id,
              'completed_at': datetime.now(timezone.utc).isoformat(),
              'review_queue_count': len(rows),
              'review_queue': rows,
          }
          recovery_path.write_text(json.dumps(recovery, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          migrations.append(migration_id)
          ack['migrations'] = sorted(set(migrations))
          ack.setdefault('schema_version', 1)
          ack.setdefault('acked_keys', [])
          ack_path.write_text(json.dumps(ack, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps({'recovery': 'prepared', 'migration_id': migration_id, 'recovered': len(rows)}, sort_keys=True))
          PY
      - name: Export persistent compact review queue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from vacature_ingestion.review_queue import build_review_queue

          def load(path):
              p = Path(path)
              if not p.exists() or not p.read_text(encoding='utf-8').strip():
                  return None
              try:
                  value = json.loads(p.read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  return None
              return value if isinstance(value, dict) else None

          current = load('.runtime/latest.json') or {}
          previous = load('.runtime/previous-review-queue.json')
          recovery = load('.runtime/recovery-review-queue.json')
          ack = load('.runtime/review-ack.json')
          seed = previous
          if recovery and isinstance(recovery.get('review_queue'), list):
              seed = build_review_queue(recovery, previous_doc=seed, ack_doc=ack)
          compact = build_review_queue(current, previous_doc=seed, ack_doc=ack)
          Path('.runtime/review-queue.json').write_text(
              json.dumps(compact, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps({
              'run_id': compact.get('run_id'),
              'review_queue_count': compact.get('review_queue_count', 0),
          }, sort_keys=True))
          PY
      - name: Export source health
        run: python -m vacature_ingestion export-state --state .runtime/state.sqlite3 --health-out .runtime/source-health.json
      - name: Sync compact health to Vacature Register when configured
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m vacature_ingestion sync-register --spreadsheet-id 1Owg3s5ZzPuCYTucp6ArgUNoWijKDr2TwvgbAUsJWdz0 --summary .runtime/latest.json --health .runtime/source-health.json
      - name: Persist technical state without clobbering review acknowledgements
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ingestion-state || true

          if ! git show-ref --verify --quiet refs/remotes/origin/ingestion-state; then
            rm -rf /tmp/vacature-ingestion-state
            git worktree add --detach /tmp/vacature-ingestion-state HEAD
            cd /tmp/vacature-ingestion-state
            git switch --orphan ingestion-state-snapshot
            git rm -rf . >/dev/null 2>&1 || true
            cp "$GITHUB_WORKSPACE/.runtime/state.sqlite3" state.sqlite3
            cp "$GITHUB_WORKSPACE/.runtime/latest.json" latest.json
            cp "$GITHUB_WORKSPACE/.runtime/review-queue.json" review-queue.json
            cp "$GITHUB_WORKSPACE/.runtime/review-ack.json" review-ack.json
            cp "$GITHUB_WORKSPACE/.runtime/source-health.json" source-health.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.sqlite3 latest.json review-queue.json review-ack.json source-health.json
            git commit -m "chore: persist vacancy ingestion snapshot"
            git push origin HEAD:ingestion-state
            exit 0
          fi

          success=0
          for attempt in 1 2; do
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force /tmp/vacature-ingestion-state >/dev/null 2>&1 || true
            rm -rf /tmp/vacature-ingestion-state
            git fetch origin ingestion-state
            git worktree add --detach /tmp/vacature-ingestion-state origin/ingestion-state
            cd /tmp/vacature-ingestion-state
            git switch -c "ingestion-state-update-${GITHUB_RUN_ID}-${attempt}"
            cp "$GITHUB_WORKSPACE/.runtime/state.sqlite3" state.sqlite3
            cp "$GITHUB_WORKSPACE/.runtime/latest.json" latest.json
            cp "$GITHUB_WORKSPACE/.runtime/source-health.json" source-health.json

            python - <<'PY'
            import json
            import os
            from pathlib import Path

            workspace = Path(os.environ['GITHUB_WORKSPACE'])

            def load(path, fallback):
                try:
                    value = json.loads(Path(path).read_text(encoding='utf-8'))
                    return value if isinstance(value, dict) else dict(fallback)
                except (OSError, ValueError, json.JSONDecodeError):
                    return dict(fallback)

            fallback = {'schema_version': 1, 'acked_keys': [], 'migrations': []}
            remote_ack = load('review-ack.json', fallback)
            runtime_ack = load(workspace / '.runtime/review-ack.json', fallback)
            merged = dict(remote_ack)
            for key, value in runtime_ack.items():
                merged.setdefault(key, value)
            merged['schema_version'] = max(int(remote_ack.get('schema_version') or 1), int(runtime_ack.get('schema_version') or 1))
            merged['acked_keys'] = sorted({
                str(value)
                for source in (remote_ack.get('acked_keys', []), runtime_ack.get('acked_keys', []))
                if isinstance(source, list)
                for value in source
                if value
            })
            merged['migrations'] = sorted({
                str(value)
                for source in (remote_ack.get('migrations', []), runtime_ack.get('migrations', []))
                if isinstance(source, list)
                for value in source
                if value
            })
            Path('review-ack.json').write_text(json.dumps(merged, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')

            queue = load(workspace / '.runtime/review-queue.json', {'schema_version': 1, 'review_queue': []})
            acked = set(merged['acked_keys'])
            items = [
                item for item in queue.get('review_queue', [])
                if isinstance(item, dict) and str(item.get('review_key') or '') not in acked
            ]
            queue['review_queue'] = items
            queue['review_queue_count'] = len(items)
            Path('review-queue.json').write_text(json.dumps(queue, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
            PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.sqlite3 latest.json review-queue.json review-ack.json source-health.json
            git commit -m "chore: persist vacancy ingestion snapshot"
            if git push origin HEAD:ingestion-state; then
              success=1
              break
            fi
          done
          test "$success" = "1"
      - name: Enforce ingestion success threshold
        if: always()
        run: test "${{ steps.ingest.outputs.exit_code }}" = "0"

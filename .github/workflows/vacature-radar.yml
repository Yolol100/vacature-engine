name: Vacature Radar (manual technical review)

on:
  push:
    branches: [main]
    paths:
      - 'ingestion/**'
      - 'radar/**'
      - '.github/workflows/vacature-radar.yml'
  pull_request:
    paths:
      - 'ingestion/**'
      - 'radar/**'
      - '.github/workflows/vacature-radar.yml'
  workflow_dispatch:
    inputs:
      max_candidates:
        description: 'Maximum official ATS candidates for manual specialist review'
        type: choice
        required: true
        default: '5'
        options: ['5', '10']
      discovery_scope:
        description: 'Official ATS only, or ATS followed by bounded API/jobboard discovery'
        type: choice
        required: true
        default: 'official_only'
        options: ['official_only', 'tiered']
      persist_review:
        description: 'Explicit durable technical checkpoint (requires separate repository approval gate)'
        type: boolean
        required: true
        default: false
  issues:
    types: [opened]

permissions:
  contents: read

# PR/push execute only tests. Manual commands serialize, never silently replace
# a queued run. No schedule, no legacy ingestion writer or application delivery.
concurrency:
  group: vacature-radar-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'ci' || 'manual' }}
  queue: max

jobs:
  node-checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run check
        working-directory: radar
      - run: npm test
        working-directory: radar

  radar-tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ingestion
      - run: python -m unittest discover -s ingestion/tests -p 'test_radar_queue.py' -v
      - run: python -m unittest discover -s ingestion/tests -p 'test_source_specs.py' -v
      - run: python -m compileall -q ingestion/src


  review:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.actor == 'Yolol100' && inputs.persist_review != true) ||
      (github.event_name == 'issues' &&
       github.actor == 'Yolol100' &&
       github.event.issue.user.login == 'Yolol100' &&
       (github.event.issue.title == '[radar] review 5' ||
        github.event.issue.title == '[radar] review 10' ||
        github.event.issue.title == '[radar] discover 5' ||
        github.event.issue.title == '[radar] discover 10'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      RADAR_ISSUE_TITLE: ${{ github.event.issue.title }}
      RADAR_MAX_CANDIDATES: ${{ inputs.max_candidates }}
      RADAR_DISCOVERY_SCOPE: ${{ inputs.discovery_scope }}
      VACATURE_REGISTER_ID: '1Owg3s5ZzPuCYTucp6ArgUNoWijKDr2TwvgbAUsJWdz0'
      RADAR_RESULT_ID: '1uLr7snvnCw2JmzdIL_yN4Jln0tMZJnOZK-mfh_DygwQ'
      RADAR_BASELINE_MIN_RECORDS: '26'
      RADAR_EXPECTED_SERVICE_ACCOUNT_EMAIL: 'vacature-radar@leads-507621.iam.gserviceaccount.com'
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ingestion
      - name: Restore existing technical history without any writes
        run: bash radar/scripts/load-review-state.sh
      - name: Review official ATS without Sheets or state writes
        run: node radar/src/actions-review-cli.mjs

  checkpoint-review:
    # Double approval: owner-initiated workflow_dispatch boolean AND explicit
    # repository variable. A normal ChatGPT issue can NEVER enter this job.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'Yolol100' &&
      inputs.persist_review == true &&
      inputs.discovery_scope != 'tiered' &&
      vars.RADAR_PERSIST_APPROVED == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      RADAR_MAX_CANDIDATES: ${{ inputs.max_candidates }}
      RADAR_PERSIST: '1'
      RADAR_APPROVED_PERSIST: ${{ vars.RADAR_PERSIST_APPROVED }}
      VACATURE_REGISTER_ID: '1Owg3s5ZzPuCYTucp6ArgUNoWijKDr2TwvgbAUsJWdz0'
      RADAR_RESULT_ID: '1uLr7snvnCw2JmzdIL_yN4Jln0tMZJnOZK-mfh_DygwQ'
      RADAR_BASELINE_MIN_RECORDS: '26'
      RADAR_EXPECTED_SERVICE_ACCOUNT_EMAIL: 'vacature-radar@leads-507621.iam.gserviceaccount.com'
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ingestion
      - name: Restore and bind existing technical history to its base SHA
        run: bash radar/scripts/load-review-state.sh
      - name: Review and stage completed-only technical receipt
        run: node radar/src/actions-review-cli.mjs
      - name: Checkpoint on existing radar-state branch with compare-and-swap and readback
        run: bash radar/scripts/persist-review-state.sh

  checkpoint-denied:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.persist_review == true &&
      (github.actor != 'Yolol100' || vars.RADAR_PERSIST_APPROVED != 'yes' ||
       inputs.discovery_scope == 'tiered')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Fail closed without repository owner plus explicit approval
        run: |
          echo "Technical persistence is not approved. No data changed."
          exit 1

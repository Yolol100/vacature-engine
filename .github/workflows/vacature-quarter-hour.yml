name: Vacature Radar quarter-hour observations

on:
  schedule:
    - cron: '6,21,36,51 * * * *'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

# Read-only evidence; cannot write sheets, commit technical state or apply.
concurrency:
  group: vacature-radar-quarter-hour
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.event_name == 'schedule' ||
      (github.actor == 'Yolol100' &&
       (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' &&
         github.event.issue.user.login == 'Yolol100' &&
         github.event.issue.title == '[radar] quarter 10')))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      RADAR_RUN_MODE: 'quarter_hour_readonly'
      RADAR_ISSUE_TITLE: ${{ github.event.issue.title }}
      RADAR_MAX_CANDIDATES: '10'
      RADAR_DISCOVERY_SCOPE: 'official_only'
      VACATURE_REGISTER_ID: '1Owg3s5ZzPuCYTucp6ArgUNoWijKDr2TwvgbAUsJWdz0'
      RADAR_RESULT_ID: '1uLr7snvnCw2JmzdIL_yN4Jln0tMZJnOZK-mfh_DygwQ'
      RADAR_BASELINE_MIN_RECORDS: '26'
      RADAR_EXPECTED_SERVICE_ACCOUNT_EMAIL: 'vacature-radar@leads-507621.iam.gserviceaccount.com'
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ingestion
      - name: Restore existing technical history without mutation
        run: bash radar/scripts/load-review-state.sh
      - name: Check official ATS and capture bounded technical output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          node radar/src/actions-review-cli.mjs > .runtime/scheduled-observations.log
      - name: Preserve result and failure diagnostics for hourly consumer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radar-observations-${{ github.run_id }}
          path: .runtime/scheduled-observations.log
          retention-days: 2
          if-no-files-found: warn

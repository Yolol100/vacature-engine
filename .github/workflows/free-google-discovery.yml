name: Free Google vacancy discovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Free-plan check (0 searches) or bounded Google discovery"
        required: true
        type: choice
        default: check
        options:
          - check
          - page-1
          - page-3
          - page-10

permissions:
  contents: read

concurrency:
  group: free-google-discovery
  cancel-in-progress: false

jobs:
  free-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install the existing ingestion package
        run: python -m pip install -e ingestion
      - name: Check configured key and FREE account (no search credits used)
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SEARCH_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlencode
          from vacature_ingestion.adapters.serpapi_google import (
              _ACCOUNT_URL, _get_json, _is_safe_free_account,
          )
          from vacature_ingestion.http import FetchError

          key = os.environ.get("SERPAPI_API_KEY", "").strip()
          if not key:
              raise SystemExit("BLOCKED: SERPAPI_API_KEY is not configured.")
          try:
              account = _get_json(_ACCOUNT_URL + "?" + urlencode({"api_key": key}), timeout=15)
          except FetchError as error:
              raise SystemExit("BLOCKED: account verification failed (" + error.category + ")") from None
          mode = os.environ.get("SEARCH_MODE", "check")
          pages = {"check": 0, "page-1": 1, "page-3": 3, "page-10": 10}.get(mode)
          if pages is None:
              raise SystemExit("BLOCKED: invalid search mode")
          budget = pages * 4
          if not _is_safe_free_account(account, budget, 0 if mode == "check" else 10):
              raise SystemExit("BLOCKED: active zero-cost Free Plan or available quota not verified.")
          print("Verified: active free plan, zero monthly price.")
          free_left = min(account["plan_searches_left"], account["total_searches_left"])
          hourly_left = account["account_rate_limit_per_hour"] - account["this_hour_searches"]
          print("Free monthly searches remaining:", free_left, "| hourly capacity:", hourly_left)
          if mode == "check":
              ready = _is_safe_free_account(account, 4, 10)
              print("Ready for page-1 with reserve:", "yes" if ready else "no")
          else:
              print("Approved search budget:", budget, "requests")
          print("Mode:", mode, "| max Google requests:", budget)
          PY
        # The mode is passed separately to prevent arbitrary shell interpolation.
      - name: Verify the live source registry (no searches)
        if: ${{ inputs.mode != 'check' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "BLOCKED: read-only Google Sheets credentials are missing."
            exit 2
          fi
          python -m vacature_ingestion filter-specs \
            --specs ingestion/source-specs.google-optional.json \
            --spreadsheet-id 1Owg3s5ZzPuCYTucp6ArgUNoWijKDr2TwvgbAUsJWdz0 \
            --out "$RUNNER_TEMP/active-google-specs.json"
      - name: Run bounded, discovery-only search
        if: ${{ inputs.mode != 'check' }}
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SEARCH_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          from vacature_ingestion.models import SourceSpec
          from vacature_ingestion.runner import IngestionRunner

          root = Path(os.environ["RUNNER_TEMP"])
          specs = json.loads((root / "active-google-specs.json").read_text(encoding="utf-8"))
          if len(specs) != 1 or specs[0].get("source_id") != "google-jobs":
              raise SystemExit("BLOCKED: the sole registered Google source is not active")
          pages = {"page-1": 1, "page-3": 3, "page-10": 10}[os.environ["SEARCH_MODE"]]
          chosen = dict(specs[0])
          options = dict(chosen.get("options") or {})
          count = len(set(options.get("queries", [])))
          if count < 1 or count > 20:
              raise SystemExit("BLOCKED: query configuration is invalid")
          options["max_pages"] = pages
          options["max_requests_per_run"] = pages * count
          options["free_quota_reserve"] = 10
          chosen["options"] = options
          with tempfile.TemporaryDirectory() as tmp:
              runner = IngestionRunner(Path(tmp) / "discovery.sqlite3")
              try:
                  result = runner.run_source(SourceSpec.from_dict(chosen))
              finally:
                  runner.close()
          if not result.success:
              print("BLOCKED:", result.failure_category or "unknown_error")
              raise SystemExit(2)
          observations = result.observations or []
          path = root / "google-discoveries.json"
          path.write_text(json.dumps({
              "discovery_only": True,
              "official_verification_required": True,
              "source": "google-jobs",
              "count": len(observations),
              "observations": observations,
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Completed:", len(observations), "unverified observations.")
          print("No application, source or Register changes were made.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.mode != 'check' && success() }}
        with:
          name: google-discovery-candidates-unverified
          path: ${{ runner.temp }}/google-discoveries.json
          retention-days: 1
          if-no-files-found: error

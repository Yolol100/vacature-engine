name: Vacature Register writer permission probe

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  prove-existing-write-scope:
    # Only repository owner may start a one-time, idempotent cell write test.
    if: >-
      github.event_name == 'issues' &&
      github.actor == 'Yolol100' &&
      github.event.issue.user.login == 'Yolol100' &&
      github.event.issue.title == '[ingestion] writer 403 probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PROBE_ISSUE_TITLE: ${{ github.event.issue.title }}
      PROBE_ISSUE_OWNER: ${{ github.event.issue.user.login }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ingestion
      - name: Prove writer permission with identical read-write-readback
        run: python -m vacature_ingestion.writer_permission_probe

name: Vacature Radar - Apps Script code sync (no vacancy scans)

on:
  push:
    branches: [main]
    paths:
      - automation/google-apps-script/Code.gs
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect the existing project, or deploy after reviewing the live hash
        required: true
        type: choice
        default: inspect
        options: [inspect, deploy]
      expected_live_sha256:
        description: Required for deploy (copy the live SHA256 from a fresh inspect run)
        required: false
        type: string
      expected_github_sha256:
        description: Required for deploy (copy the GitHub SHA256 from the same inspect run)
        required: false
        type: string

permissions:
  contents: read

# Never overlap an automatic push and a manual deployment.
concurrency:
  group: vacature-radar-code-sync
  cancel-in-progress: false

jobs:
  apps-script-sync:
    # Explicitly OFF for automatic updates until first inspected manual sync.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && vars.VACATURE_RADAR_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run isolated no-network regression tests
        run: node --test automation/google-apps-script/radar.test.cjs automation/google-apps-script/sync.test.mjs
      - name: Choose safe mode and expected live hash
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          USER_MODE: ${{ inputs.operation }}
          USER_EXPECTED_SHA: ${{ inputs.expected_live_sha256 }}
          USER_EXPECTED_GITHUB_SHA: ${{ inputs.expected_github_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            # GitHub may replace a pending workflow run. Any first-parent
            # predecessor is valid only if its scanner code matches live.
            # This accepts skipped intermediate pushes but rejects editor drift.
            approved=""
            mapfile -t revisions < <(git rev-list --first-parent --max-count=100 HEAD)
            for commit in "${revisions[@]:1}"; do
              if git cat-file -e "$commit:automation/google-apps-script/Code.gs" 2>/dev/null; then
                digest="$(git show "$commit:automation/google-apps-script/Code.gs" | sha256sum | cut -d ' ' -f 1)"
                approved="${approved:+$approved,}$digest"
              fi
            done
            if [[ -z "$approved" ]]; then
              echo "BLOCKED: no known prior main code hash"; exit 1
            fi
            echo "RADAR_SYNC_MODE=deploy" >> "$GITHUB_ENV"
            echo "RADAR_APPROVED_LIVE_SHA256S=$approved" >> "$GITHUB_ENV"
            echo "RADAR_EXPECTED_GITHUB_SHA256=$(sha256sum automation/google-apps-script/Code.gs | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          elif [[ "$USER_MODE" == "inspect" ]]; then
            echo "RADAR_SYNC_MODE=inspect" >> "$GITHUB_ENV"
          elif [[ "$USER_MODE" == "deploy" && "$USER_EXPECTED_SHA" =~ ^[a-f0-9]{64}$ && "$USER_EXPECTED_GITHUB_SHA" =~ ^[a-f0-9]{64}$ ]]; then
            actual_github="$(sha256sum automation/google-apps-script/Code.gs | cut -d ' ' -f 1)"
            if [[ "$USER_EXPECTED_GITHUB_SHA" != "$actual_github" ]]; then
              echo "BLOCKED: reviewed GitHub code changed since inspect"; exit 1
            fi
            echo "RADAR_SYNC_MODE=deploy" >> "$GITHUB_ENV"
            echo "RADAR_EXPECTED_LIVE_SHA256=$USER_EXPECTED_SHA" >> "$GITHUB_ENV"
            echo "RADAR_EXPECTED_GITHUB_SHA256=$USER_EXPECTED_GITHUB_SHA" >> "$GITHUB_ENV"
          else
            echo "BLOCKED: deploy requires both inspected live and GitHub SHA256 values"; exit 1
          fi
      - name: Inspect or synchronize existing bound project (never create triggers)
        env:
          RADAR_SCRIPT_ID: ${{ secrets.RADAR_SCRIPT_ID }}
          RADAR_GOOGLE_CLIENT_ID: ${{ secrets.RADAR_GOOGLE_CLIENT_ID }}
          RADAR_GOOGLE_CLIENT_SECRET: ${{ secrets.RADAR_GOOGLE_CLIENT_SECRET }}
          RADAR_GOOGLE_REFRESH_TOKEN: ${{ secrets.RADAR_GOOGLE_REFRESH_TOKEN }}
        run: node automation/google-apps-script/sync.mjs "$RADAR_SYNC_MODE"

name: One-pass vacancy discovery and review (free sources)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Check only or bounded free Google + existing free sources"
        required: true
        type: choice
        default: check
        options:
          - check
          - page-1
          - page-3
          - page-10
      google_queries_per_run:
        description: "Maximum distinct rotating Google queries in this run (1-20, free quota required)"
        type: string
        required: true
        default: "8"
      discovery_round:
        description: "Rotation round: auto uses Amsterdam date, or choose 0,1,2... for later source windows"
        type: string
        required: true
        default: "auto"

permissions:
  contents: read

concurrency:
  group: one-pass-vacancy-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install existing separate packages
        run: python -m pip install -e . -e ingestion
      - name: Run Register-gated, free-only review
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SEARCH_MODE: ${{ inputs.mode }}
          GOOGLE_QUERIES_PER_RUN: ${{ inputs.google_queries_per_run }}
          DISCOVERY_ROUND: ${{ inputs.discovery_round }}
        run: |
          python scripts/one_pass_vacancies.py --mode "$SEARCH_MODE" \
            --google-queries-per-run "$GOOGLE_QUERIES_PER_RUN" \
            --discovery-round "$DISCOVERY_ROUND" \
            --out "$RUNNER_TEMP/vacancy-review.json"
      - name: Render offline source coverage dashboard
        run: |
          python scripts/render_source_coverage.py \
            --input "$RUNNER_TEMP/vacancy-review.json" \
            --output "$RUNNER_TEMP/source-coverage.html"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ success() }}
        with:
          name: register-coverage-and-vacancy-review-readonly
          path: |
            ${{ runner.temp }}/vacancy-review.json
            ${{ runner.temp }}/source-coverage.html
          retention-days: 1
          if-no-files-found: error

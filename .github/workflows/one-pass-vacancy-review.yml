name: One-pass vacancy discovery and review (free sources)

on:
  push:
    branches: [qa/free-source-order-20261019]
  workflow_dispatch:
    inputs:
      mode:
        description: "Check only or bounded free Google + existing free sources"
        required: true
        type: choice
        default: check
        options:
          - check
          - page-1
          - page-3
          - page-10

permissions:
  contents: read

concurrency:
  group: one-pass-vacancy-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install existing separate packages
        run: python -m pip install -e . -e ingestion
      - name: Run Register-gated, free-only review
        env:
          SERPAPI_API_KEY: ''
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SEARCH_MODE: page-1
        run: |
          python scripts/one_pass_vacancies.py --mode "$SEARCH_MODE" --out "$RUNNER_TEMP/vacancy-review.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ github.event_name == 'push' && success() }}
        with:
          name: vacancy-review-unverified-no-personal-data
          path: ${{ runner.temp }}/vacancy-review.json
          retention-days: 1
          if-no-files-found: error

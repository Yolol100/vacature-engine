name: Cloudflare Radar checks
on:
  push:
    paths:
      - 'cloudflare-radar/**'
      - '.github/workflows/cloudflare-radar-ci.yml'
  pull_request:
    paths:
      - 'cloudflare-radar/**'
      - '.github/workflows/cloudflare-radar-ci.yml'
jobs:
  node-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/index.mjs && node --check src/logic.mjs && node --check src/health.mjs && node --check src/compact-register.mjs && node --check src/staged-review.mjs
        working-directory: cloudflare-radar
      - run: node --test test/*.test.mjs
        working-directory: cloudflare-radar
      - name: Read-only official ATS smoke (temporary PR acceptance)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/radar-reuse-official-personio-workable-20261017'
        shell: bash
        run: |
          set -uo pipefail
          while IFS='|' read -r provider account employer; do
            if PYTHONPATH=ingestion/src python3 -m vacature_ingestion.actions_readonly_bridge "$provider" "$account" "$employer" >/tmp/radar-ats-probe.json 2>/tmp/radar-ats-probe.err; then
              python3 -c "import json; r=json.load(open('/tmp/radar-ats-probe.json')); print('PROBE_OK '+str(len(r['jobs']))+' jobs '+str([x['url'] for x in r['jobs'][:2]]))"
            else
              printf 'PROBE_ERROR %s:%s ' "$provider" "$account"
              tr -d '\\n' </tmp/radar-ats-probe.err
              echo
            fi
          done <<'ATS'
          personio|syde|Syde
          workable|awesomemotive|Awesome Motive
          workable|humanmade|Human Made
          ATS
      - name: Install Wrangler for build-only verification
        run: npm install --no-audit --no-fund
        working-directory: cloudflare-radar
      - name: Bundle Worker without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/vacature-radar-bundle
        working-directory: cloudflare-radar

name: Cloudflare Radar checks
on:
  push:
    paths:
      - 'cloudflare-radar/**'
      - '.github/workflows/cloudflare-radar-ci.yml'
  pull_request:
    paths:
      - 'cloudflare-radar/**'
      - '.github/workflows/cloudflare-radar-ci.yml'
jobs:
  node-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/index.mjs && node --check src/logic.mjs && node --check src/health.mjs && node --check src/compact-register.mjs && node --check src/staged-review.mjs
        working-directory: cloudflare-radar
      - run: node --test test/*.test.mjs
        working-directory: cloudflare-radar
      - name: Install Wrangler for build-only verification
        run: npm install --no-audit --no-fund
        working-directory: cloudflare-radar
      - name: Bundle Worker without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/vacature-radar-bundle
        working-directory: cloudflare-radar
